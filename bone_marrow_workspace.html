<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bone Marrow Reporting Workspace</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14243b}.tabs{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #dbe3ef;position:sticky;top:0;z-index:10}.tabs strong{margin-right:20px}.tabs button{padding:11px 18px;border:1px solid #dbe3ef;border-radius:9px;background:#f2f6fc;cursor:pointer;font-weight:700;color:#263e60}.tabs button[aria-selected=true]{background:#2563eb;color:#fff;border-color:#2563eb}.tabs a{margin-left:auto;color:#2563eb;font-size:13px}iframe{display:block;width:100%;height:calc(100dvh - 62px);border:0}iframe[hidden]{display:none}@media(max-width:650px){.tabs{flex-wrap:wrap}.tabs strong{width:100%}.tabs a{margin-left:0}}</style></head><body><nav class="tabs" role="tablist" aria-label="Bone marrow workflow"><strong>Bone Marrow Workspace</strong><button type="button" role="tab" id="clinical-tab" aria-controls="clinical-frame" aria-selected="true">1. Clinical Review</button><button type="button" role="tab" id="report-tab" aria-controls="report-frame" aria-selected="false">2. BM Report</button><a href="index.html">← Home</a></nav><iframe id="clinical-frame" title="Clinical and laboratory review" src="bone_marrow_clinical_review.html"></iframe><iframe id="report-frame" title="Bone marrow reporting v17" src="bone_marrow_reporting_template_v17.html" hidden></iframe><script>const tabs=[document.getElementById('clinical-tab'),document.getElementById('report-tab')],frames=[document.getElementById('clinical-frame'),document.getElementById('report-frame')];function activate(i){tabs.forEach((t,n)=>{t.setAttribute('aria-selected',String(i===n));t.tabIndex=i===n?0:-1;frames[n].hidden=n!==i});history.replaceState(null,'',i===1?'#report':'#clinical')}tabs.forEach((t,i)=>{t.addEventListener('click',()=>activate(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();let j=(i+(e.key==='ArrowRight'?1:1)+2)%2;activate(j);tabs[j].focus()}})});activate(location.hash==='#report'?1:0);</script></body></html>
