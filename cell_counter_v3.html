<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cell Differential Counter</title>
<style>
:root{
  --primary:#4f81bd;
  --secondary:#2f5597;
  --accent:#d9e8fb;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#243447;
  --muted:#667085;
  --border:#c9d7ea;
  --shadow:0 8px 24px rgba(47,85,151,0.10);
  --myelo:#fff1d6;
  --gran:#e4f2e6;
  --lymph:#e6f0fb;
  --ery:#f8e3ea;
  --other:#efe8f7;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:1400px;
  margin:0 auto;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  line-height:1.45;
}
.header{
  text-align:center;
  padding:18px 20px;
  margin-bottom:20px;
  background:linear-gradient(135deg,#ffffff,#edf5ff);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
}
h1,h2,h3{color:var(--secondary);margin-top:0}
.header h1{margin-bottom:4px}
.header p{margin:0;color:var(--muted)}
.dashboard{
  display:flex;
  flex-wrap:nowrap;
  gap:20px;
  margin-bottom:20px;
}
.counter-section{
  flex:1;
  min-width:300px;
  display:flex;
  flex-direction:column;
}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:18px;
}
.keypad-panel{padding:18px}
.total-count{
  font-size:2.2em;
  font-weight:700;
  color:var(--primary);
}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:560px;
}
.cell-key{
  min-height:112px;
  padding:16px 10px;
  border:3px solid var(--primary);
  border-radius:10px;
  cursor:pointer;
  background:#fff;
  font-size:18px;
  font-weight:500;
  position:relative;
  transition:all .15s ease;
}
.cell-key:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(47,85,151,.18)}
.cell-key:active{transform:translateY(0)}
.cell-key .key-num{font-size:1.7em;line-height:1;color:#000}
.cell-key .label{font-size:1.08em;margin-top:8px;color:#000}
.cell-count{
  position:absolute;
  right:12px;
  top:10px;
  font-size:1.05em;
  color:var(--secondary);
}
.cell-percent{
  position:absolute;
  right:12px;
  bottom:10px;
  font-size:.9em;
  color:#555;
}
#blast,#promyelo,#myeloMeta{background:var(--myelo)}
#segBand,#monocyte,#eosinophil,#basophil{background:var(--gran)}
#lymphocyte,#plasma{background:var(--lymph)}
#erythroid{background:var(--ery)}
#mast{background:var(--other)}
.empty-cell{visibility:hidden}
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin:8px 0 0;
}
.btn{
  padding:11px 20px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:650;
  font-size:15px;
}
.btn-primary{background:var(--primary);color:white}
.btn-secondary{background:#e6ecf5;color:var(--text)}
.btn:hover{filter:brightness(.98);transform:translateY(-1px)}
#report,#lastReportContent{overflow-y:auto}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  font-size:.92em;
}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #e5eaf2;
  text-align:left;
}
th{background:#edf3fb;color:var(--secondary)}
.summary-box{
  margin-top:14px;
  padding:12px;
  background:#f8fbff;
  border:1px solid var(--border);
  border-radius:10px;
  white-space:normal;
}
.copy-btn{
  margin-top:10px;
  padding:8px 12px;
  border:0;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}
.footer{
  margin-top:auto;
  text-align:center;
  padding:12px;
  font-size:12px;
  color:#666;
}
@media(max-width:900px){
  .dashboard{flex-direction:column}
}
</style>
</head>
<body>
<div class="header">
  <h1>Cell Differential Counter</h1>
  <p>Click buttons or use keyboard shortcuts to count cells</p>
</div>

<div class="dashboard">
  <div class="counter-section">
    <div class="panel">
      <h2>Current Count</h2>
      <div class="total-count" id="totalCount">0</div>
    </div>

    <div class="panel keypad-panel">
      <div class="keypad">
        <button class="cell-key" id="eosinophil" data-cell="eosinophil"><div class="key-num">7</div><div class="label">Eosinophil</div><span class="cell-count" id="eosinophil-count">0</span><span class="cell-percent" id="eosinophil-percent">0%</span></button>
        <button class="cell-key" id="plasma" data-cell="plasma"><div class="key-num">8</div><div class="label">Plasma</div><span class="cell-count" id="plasma-count">0</span><span class="cell-percent" id="plasma-percent">0%</span></button>
        <button class="cell-key" id="basophil" data-cell="basophil"><div class="key-num">9</div><div class="label">Basophil</div><span class="cell-count" id="basophil-count">0</span><span class="cell-percent" id="basophil-percent">0%</span></button>

        <button class="cell-key" id="lymphocyte" data-cell="lymphocyte"><div class="key-num">4</div><div class="label">Lymphocyte</div><span class="cell-count" id="lymphocyte-count">0</span><span class="cell-percent" id="lymphocyte-percent">0%</span></button>
        <button class="cell-key" id="segBand" data-cell="segBand"><div class="key-num">5</div><div class="label">Seg/Band</div><span class="cell-count" id="segBand-count">0</span><span class="cell-percent" id="segBand-percent">0%</span></button>
        <button class="cell-key" id="monocyte" data-cell="monocyte"><div class="key-num">6</div><div class="label">Monocyte</div><span class="cell-count" id="monocyte-count">0</span><span class="cell-percent" id="monocyte-percent">0%</span></button>

        <button class="cell-key" id="blast" data-cell="blast"><div class="key-num">1</div><div class="label">Blast</div><span class="cell-count" id="blast-count">0</span><span class="cell-percent" id="blast-percent">0%</span></button>
        <button class="cell-key" id="promyelo" data-cell="promyelo"><div class="key-num">2</div><div class="label">Promyelo</div><span class="cell-count" id="promyelo-count">0</span><span class="cell-percent" id="promyelo-percent">0%</span></button>
        <button class="cell-key" id="myeloMeta" data-cell="myeloMeta"><div class="key-num">3</div><div class="label">Myelo/Meta</div><span class="cell-count" id="myeloMeta-count">0</span><span class="cell-percent" id="myeloMeta-percent">0%</span></button>

        <button class="cell-key" id="erythroid" data-cell="erythroid"><div class="key-num">0</div><div class="label">Erythroid</div><span class="cell-count" id="erythroid-count">0</span><span class="cell-percent" id="erythroid-percent">0%</span></button>
        <button class="cell-key" id="mast" data-cell="mast"><div class="key-num">/</div><div class="label">Mast</div><span class="cell-count" id="mast-count">0</span><span class="cell-percent" id="mast-percent">0%</span></button>
        <div class="empty-cell"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
      <button class="btn btn-secondary" onclick="resetCounts()">Reset (R)</button>
      <button class="btn btn-secondary" onclick="undoLastCount()" id="undoButton" disabled>Undo (-)</button>
      <button class="btn btn-secondary" onclick="toggleSound()" id="soundToggle">Sound: ON</button>
    </div>
  </div>

  <div class="counter-section">
    <div class="panel">
      <h2>Current Report</h2>
      <div id="report"></div>
    </div>
  </div>

  <div class="counter-section">
    <div class="panel">
      <h2>Last Report</h2>
      <div id="lastReportContent"></div>
    </div>
  </div>
</div>

<footer class="footer">&copy; 2025 Cell Differential Counter by Qianghua Zhou. All rights reserved.</footer>

<audio id="clickSound" src="https://www.myinstants.com/media/sounds/exoracer-button.mp3" preload="auto"></audio>
<audio id="hundredSound" src="https://www.myinstants.com/media/sounds/level-up.mp3" preload="auto"></audio>

<script>
const counts = {
  blast: 0,
  promyelo: 0,
  myeloMeta: 0,
  segBand: 0,
  erythroid: 0,
  lymphocyte: 0,
  monocyte: 0,
  eosinophil: 0,
  basophil: 0,
  plasma: 0,
  mast: 0
};

const cellOrder = ['blast','promyelo','myeloMeta','segBand','erythroid','lymphocyte','monocyte','eosinophil','basophil','plasma','mast'];

const reportLabels = {
  blast: 'Blast',
  promyelo: 'Promyelo',
  myeloMeta: 'Myelo/Meta',
  segBand: 'Seg/Band',
  erythroid: 'Erythroid',
  lymphocyte: 'Lymphocyte',
  monocyte: 'Monocyte',
  eosinophil: 'Eosinophil',
  basophil: 'Basophil',
  plasma: 'Plasma',
  mast: 'Mast'
};

const summaryLabels = {
  blast: 'Blast',
  promyelo: 'Promyelocyte',
  myeloMeta: 'Myelo/Meta',
  segBand: 'Seg/Band Neutrophil',
  erythroid: 'Erythroid',
  lymphocyte: 'Lymphocyte',
  monocyte: 'Monocyte',
  eosinophil: 'Eosinophil',
  basophil: 'Basophil',
  plasma: 'Plasma cell',
  mast: 'Mast cell'
};

const keyMap = {
  '1': 'blast',
  '2': 'promyelo',
  '3': 'myeloMeta',
  '4': 'lymphocyte',
  '5': 'segBand',
  '6': 'monocyte',
  '7': 'eosinophil',
  '8': 'plasma',
  '9': 'basophil',
  '0': 'erythroid',
  '/': 'mast'
};

const clickSound = document.getElementById('clickSound');
const hundredSound = document.getElementById('hundredSound');
let soundEnabled = true;
let lastTotal = 0;
let countHistory = [];

window.onload = function(){
  loadLastReport();
  loadSoundPreference();
  updateDisplay();
};

document.querySelectorAll('.cell-key').forEach(button => {
  button.addEventListener('click', () => addCount(button.dataset.cell));
});

function totalCount(){
  return Object.values(counts).reduce((a,b)=>a+b,0);
}

function addCount(cellType){
  if (!Object.prototype.hasOwnProperty.call(counts, cellType)) return;
  counts[cellType]++;
  countHistory.push(cellType);
  updateDisplay();
  playClickSound();
}

function updateDisplay(){
  const total = totalCount();
  document.getElementById('totalCount').textContent = total;

  cellOrder.forEach(cellType => {
    const count = counts[cellType];
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    const countEl = document.getElementById(cellType + '-count');
    const pctEl = document.getElementById(cellType + '-percent');
    if (countEl) countEl.textContent = count;
    if (pctEl) pctEl.textContent = pct + '%';
  });

  if (soundEnabled && total > lastTotal && total > 0 && total % 100 === 0) {
    hundredSound.currentTime = 0;
    hundredSound.play().catch(()=>{});
  }
  lastTotal = total;
  document.getElementById('undoButton').disabled = countHistory.length === 0;
}

function calculateMERatio(){
  const myeloidTotal = counts.blast + counts.promyelo + counts.myeloMeta + counts.segBand + counts.eosinophil + counts.basophil;
  const erythroidTotal = counts.erythroid;

  if (myeloidTotal === 0 && erythroidTotal === 0) return 'N/A';
  if (erythroidTotal === 0) return 'N/A (no erythroid cells)';
  if (myeloidTotal === 0) return 'N/A (no myeloid cells)';

  const ratio = myeloidTotal / erythroidTotal;
  if (ratio >= 1) return ratio.toFixed(1).replace(/\.0$/,'') + ':1';
  return '1:' + (1 / ratio).toFixed(1).replace(/\.0$/,'');
}

function generateReport(){
  const total = totalCount();
  let reportHTML = '<h3>Differential Count Report</h3>';

  if (total === 0) {
    reportHTML += '<p>No cells counted yet</p>';
    document.getElementById('report').innerHTML = reportHTML;
    return;
  }

  reportHTML += '<table><tr><th>Cell Type</th><th>Count</th><th>Percentage</th></tr>';
  cellOrder.forEach(cellType => {
    const count = counts[cellType];
    const pct = Math.round((count / total) * 100);
    reportHTML += '<tr><td>' + reportLabels[cellType] + '</td><td>' + count + '</td><td>' + pct + '%</td></tr>';
  });
  reportHTML += '</table>';

  const meRatio = calculateMERatio();
  let summaryText = 'Cells counted: ' + total + '. Cells: ';
  summaryText += cellOrder.map(cellType => {
    const pct = Math.round((counts[cellType] / total) * 100);
    return summaryLabels[cellType] + ' ' + pct + '%';
  }).join(', ');
  summaryText += '. M:E ratio: ' + meRatio + '.';

  reportHTML += '<div class="summary-box"><strong>Differential Count:</strong><br><span id="summaryText">' + summaryText + '</span></div>';
  reportHTML += '<button class="copy-btn" onclick="copyDifferentialSummary()">Copy Summary</button>';
  document.getElementById('report').innerHTML = reportHTML;
}

function resetCounts(){
  const currentReport = document.getElementById('report').innerHTML;
  if (currentReport) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(currentReport, 'text/html');
    const btn = doc.querySelector('button');
    if (btn) btn.remove();
    const updatedReport = doc.body.innerHTML;
    localStorage.setItem('lastReport', updatedReport);
    document.getElementById('lastReportContent').innerHTML = updatedReport;
  }

  Object.keys(counts).forEach(k => counts[k] = 0);
  countHistory = [];
  lastTotal = 0;
  updateDisplay();
  document.getElementById('report').innerHTML = '';
}

function undoLastCount(){
  if (countHistory.length === 0) return;
  const lastCell = countHistory.pop();
  if (counts[lastCell] > 0) counts[lastCell]--;
  updateDisplay();
}

function copyDifferentialSummary(){
  const summary = document.getElementById('summaryText');
  if (!summary) return;
  navigator.clipboard.writeText(summary.textContent).then(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) {
      btn.textContent = 'Copied';
      setTimeout(() => btn.textContent = 'Copy Summary', 1500);
    }
  }).catch(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) {
      btn.textContent = 'Failed';
      setTimeout(() => btn.textContent = 'Copy Summary', 1500);
    }
  });
}

function playClickSound(){
  if (!soundEnabled) return;
  clickSound.currentTime = 0;
  clickSound.play().catch(()=>{});
}

function toggleSound(){
  soundEnabled = !soundEnabled;
  localStorage.setItem('soundEnabled', String(soundEnabled));
  document.getElementById('soundToggle').textContent = 'Sound: ' + (soundEnabled ? 'ON' : 'OFF');
}

function loadSoundPreference(){
  const saved = localStorage.getItem('soundEnabled');
  if (saved !== null) {
    soundEnabled = saved === 'true';
    document.getElementById('soundToggle').textContent = 'Sound: ' + (soundEnabled ? 'ON' : 'OFF');
  }
}

function loadLastReport(){
  const lastReport = localStorage.getItem('lastReport');
  if (lastReport) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(lastReport, 'text/html');
    const btn = doc.querySelector('button');
    if (btn) btn.remove();
    document.getElementById('lastReportContent').innerHTML = doc.body.innerHTML;
  }
}

document.addEventListener('keydown', event => {
  if (event.ctrlKey || event.metaKey) {
    if (event.key.toLowerCase() === 'z') {
      event.preventDefault();
      undoLastCount();
    }
    return;
  }

  if (keyMap[event.key]) {
    event.preventDefault();
    addCount(keyMap[event.key]);
  } else if (event.key.toLowerCase() === 'r') {
    event.preventDefault();
    resetCounts();
  } else if (event.key === '-') {
    event.preventDefault();
    undoLastCount();
  }
});
</script>
</body>
</html>
