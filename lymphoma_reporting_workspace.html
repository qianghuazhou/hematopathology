<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lymphoma Reporting Workspace</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14243b}.tabs{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #dbe3ef;position:sticky;top:0;z-index:10;flex-wrap:wrap}.tabs strong{margin-right:20px}.tabs button{padding:11px 15px;border:1px solid #dbe3ef;border-radius:9px;background:#f2f6fc;cursor:pointer;font-weight:700;color:#263e60}.tabs button[aria-selected=true]{background:#2563eb;color:#fff;border-color:#2563eb}.tabs a{margin-left:auto;color:#2563eb;font-size:13px}iframe{display:block;width:100%;height:calc(100dvh - 66px);border:0}iframe[hidden]{display:none}@media(max-width:760px){.tabs strong{width:100%}.tabs a{margin-left:0}iframe{height:calc(100dvh - 120px)}}</style></head><body><nav class="tabs" role="tablist" aria-label="Lymphoma workflow"><strong>Lymphoma Reporting Workspace</strong><button role="tab" id="report-tab" aria-controls="report-frame" aria-selected="true">1. LN Report</button><button role="tab" id="delabie-tab" aria-controls="delabie-frame" aria-selected="false">2. Lymphoma Report</button><button role="tab" id="nhl-tab" aria-controls="nhl-frame" aria-selected="false">3. Non-Hodgkin Synoptic</button><button role="tab" id="hl-tab" aria-controls="hl-frame" aria-selected="false">4. Hodgkin Synoptic</button><a href="index.html">← Home</a></nav><iframe id="report-frame" title="Lymph node reporting" src="lymph_node_reporting_workspace_v1.html"></iframe><iframe id="delabie-frame" title="Lymphoma reporting Delabie style" src="dr_delabie_style_lymphoma_generator_v16.html" hidden></iframe><iframe id="nhl-frame" title="Non-Hodgkin lymphoma WHO5 synoptic" src="lymphoma_synoptic_generator_who5_v34.html" hidden></iframe><iframe id="hl-frame" title="Hodgkin lymphoma synoptic" src="hodgkin_synoptic_generator_v16.html" hidden></iframe><script>const ids=['report','delabie','nhl','hl'],tabs=ids.map(id=>document.getElementById(id+'-tab')),frames=ids.map(id=>document.getElementById(id+'-frame'));function activate(i){tabs.forEach((t,n)=>{t.setAttribute('aria-selected',String(n===i));t.tabIndex=n===i?0:-1;frames[n].hidden=n!==i});history.replaceState(null,'','#'+ids[i])}tabs.forEach((t,i)=>{t.addEventListener('click',()=>activate(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const j=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;activate(j);tabs[j].focus()}})});const initial=ids.indexOf(location.hash.slice(1));activate(initial<0?0:initial);</script></body></html>
