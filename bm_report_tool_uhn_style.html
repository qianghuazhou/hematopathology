<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bone Marrow Report Tool — UHN Style</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111827;
    --panel-2: #0f172a;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: radial-gradient(1000px 600px at 10% -10%, #1f2937, var(--bg));
    color: var(--text);
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid #1f2937; backdrop-filter: blur(6px);
    background: linear-gradient(180deg, rgba(15,23,42,0.75), rgba(15,23,42,0.35));
  }
  h1 { margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .container { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid #1f2937; border-radius: 14px; padding: 14px; }
  .form { display: grid; gap: 16px; }
  .section { background: var(--panel-2); border-radius: 12px; padding: 12px; border: 1px solid #1f2937; margin-bottom: 10px; }
  .section h3 { margin: 0 0 8px 0; font-size: 15px; color: #cbd5e1; letter-spacing: .2px; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type="text"], input[type="number"], input[type="date"], textarea, select {
    width: 100%; padding: 8px 10px; background: #0b1220; color: var(--text);
    border: 1px solid #293042; border-radius: 8px; outline: none;
  }
  .checkbox-group { margin-top: 5px; }
  .cb-item { display: flex; align-items: flex-start; gap: 8px; font-size: 11px; margin-bottom: 4px; color: var(--text); cursor: pointer; }
  .cb-other { margin-top: 8px; display: flex; align-items: center; gap: 5px; }
  .actions { display: flex; gap: 10px; margin: 20px 0; }
  button {
    border: 1px solid #2b3448; background: linear-gradient(180deg, #1f2937, #101826);
    color: #e5e7eb; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 600;
  }
  button.primary { border-color:#2a4365; background: linear-gradient(180deg, #2563eb, #1e40af); }
  .output { 
    white-space: pre-wrap; background:#0b1220; border:1px dashed #334155; 
    padding:15px; border-radius:10px; min-height:300px; 
    font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.4;
  }
  @media (max-width: 700px) {
    .grid-4, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <h1>Bone Marrow Report Tool — UHN Style</h1>
  </header>

  <div class="container">
    <main class="panel">
      <form id="reportForm">
        
        <div class="section">
          <h3>Peripheral Blood Count (CBC)</h3>
          <div class="grid-4">
            <div><label>Hb (g/L)</label><input type="number" id="hgb" step="any"></div>
            <div><label>WBC (x10e9/L)</label><input type="number" id="lkc" step="any"></div>
            <div><label>Plt (x10e9/L)</label><input type="number" id="plt" step="any"></div>
            <div><label>MCV (fL)</label><input type="number" id="mcv" step="any"></div>
            <div><label>RDW (%)</label><input type="number" id="rdw" step="any"></div>
            <div><label>RBC (x10e9/L)</label><input type="number" id="erc" step="any"></div>
            <div><label>Neutrophils (x10e9/L)</label><input type="number" id="anc" step="any"></div>
            <div><label>Lymphocytes (x10e9/L)</label><input type="number" id="alc" step="any"></div>
            <div><label>Monocytes (x10e9/L)</label><input type="number" id="amc" step="any"></div>
            <div><label>Eosinophils (x10e9/L)</label><input type="number" id="eos" step="any"></div>
            <div><label>Basophils (x10e9/L)</label><input type="number" id="baso" step="any"></div>
          </div>
        </div>

        <div class="section">
          <h3>Blood Smear Morphology</h3>
          <div class="grid-3">
            <div>
              <label>RBC Morphology</label>
              <div class="checkbox-group" data-group="rbc_morph">
                <label class="cb-item"><input type="checkbox" value="No significant abnormality" checked> No abnormality</label>
                <label class="cb-item"><input type="checkbox" value="Anisopoikilocytosis"> Anisopoikilo</label>
                <input type="text" id="rbc_other" placeholder="Other...">
              </div>
            </div>
            <div>
              <label>WBC Morphology</label>
              <div class="checkbox-group" data-group="wbc_morph">
                <label class="cb-item"><input type="checkbox" value="No significant abnormality" checked> No abnormality</label>
                <label class="cb-item"><input type="checkbox" value="Left shift"> Left shift</label>
                <input type="text" id="wbc_other" placeholder="Other...">
              </div>
            </div>
            <div>
              <label>Platelet Morphology</label>
              <div class="checkbox-group" data-group="plt_morph">
                <label class="cb-item"><input type="checkbox" value="No significant abnormality" checked> No abnormality</label>
                <label class="cb-item"><input type="checkbox" value="Giant platelets"> Giant Plt</label>
                <input type="text" id="plt_other" placeholder="Other...">
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h3>Bone Marrow Aspirate Description</h3>
          <div class="grid-3">
            <div><label>Aspirate Quality</label><input type="text" id="asp_quality" value="Adequate"></div>
            <div><label>Aspirate Fragments</label><input type="text" id="asp_fragments" value="Adequate"></div>
            <div><label>Aspirate Cellularity</label><input type="text" id="asp_cellularity" value="Normocellular"></div>
          </div>
          <div class="grid-3" style="margin-top:15px;">
            <div>
              <label>Erythropoiesis</label>
              <select id="ery_status"><option>Normocellular</option><option>Increased</option><option>Decreased</option></select>
              <input type="text" id="ery_morph" value="normoblastic, orderly maturation" style="margin-top:5px;">
            </div>
            <div>
              <label>Granulopoiesis</label>
              <select id="gran_status"><option>Normocellular</option><option>Increased</option><option>Decreased</option></select>
              <input type="text" id="gran_morph" value="complete, orderly maturation" style="margin-top:5px;">
            </div>
            <div>
              <label>Megakaryopoiesis</label>
              <select id="mega_status"><option>Relatively hypocellular</option><option>Normal</option><option>Increased</option></select>
              <input type="text" id="mega_morph" value="normal morphology" style="margin-top:5px;">
            </div>
          </div>
        </div>

        <div class="section">
          <h3>Differential Count (%)</h3>
          <div class="grid-4">
            <div><label>Cells Counted</label><input type="number" id="diff_total" value="500"></div>
            <div><label>Blasts</label><input type="number" id="d_blasts"></div>
            <div><label>Promyelo</label><input type="number" id="d_pro"></div>
            <div><label>Myelo</label><input type="number" id="d_myelo"></div>
            <div><label>Meta</label><input type="number" id="d_meta"></div>
            <div><label>Neutro</label><input type="number" id="d_neut"></div>
            <div><label>Erythro</label><input type="number" id="d_ery"></div>
            <div><label>Lymph</label><input type="number" id="d_lym"></div>
            <div><label>Plasma</label><input type="number" id="d_plasma"></div>
            <div><label>M:E Ratio</label><input type="text" id="me_ratio"></div>
          </div>
        </div>

        <div class="section">
          <h3>Other</h3>
          <div class="grid-4">
            <div><label>Mast Cells</label><input type="text" id="mast_cells" value="Not increased"></div>
            <div><label>Ring Sideroblasts</label><input type="text" id="rs_status" value="Absent"></div>
            <div><label>Iron Stores</label><input type="text" id="iron_stores" value="Adequate"></div>
            <div><label>Blasts (Asp)</label><input type="text" id="asp_blasts_desc" value="Not increased"></div>
          </div>
          <div style="margin-top:10px;">
            <label>Flow Cytometry / Summary</label>
            <textarea id="flow_summary" placeholder="Enter flow results here..."></textarea>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="primary" onclick="generateReport()">Generate Report</button>
          <button type="button" onclick="copyReport()">Copy to Clipboard</button>
          <button type="button" onclick="resetForm()">Reset</button>
        </div>

        <div id="reportOutput" class="output">The generated report will appear here...</div>
      </form>
    </main>
  </div>

  <script>
    function getGroupValues(groupName, otherId) {
      const checked = Array.from(document.querySelectorAll(`.checkbox-group[data-group="${groupName}"] input:checked`))
                           .map(cb => cb.value);
      const other = document.getElementById(otherId).value.trim();
      if (other) checked.push(other);
      return checked.length > 0 ? checked.join(", ") : "None";
    }

    function generateReport() {
      const val = (id) => document.getElementById(id).value || "";
      
      let report = "Synoptic Data\n\n";

      // CBC
      report += "- CBC -\n";
      report += `Hb (g/L): ${val("hgb")}\n`;
      report += `WBC (x10e9/L): ${val("lkc")}\n`;
      report += `Plt (x10e9/L): ${val("plt")}\n`;
      report += `MCV (fL): ${val("mcv")}\n`;
      report += `RDW (%): ${val("rdw")}\n`;
      report += `RBC (x10e9/L): ${val("erc")}\n`;
      report += `Neutrophils (x10e9/L): ${val("anc")}\n`;
      report += `Lymphocytes (x10e9/L): ${val("alc")}\n`;
      report += `Monocytes (x10e9/L): ${val("amc")}\n`;
      report += `Eosinophils (x10e9/L): ${val("eos")}\n`;
      report += `Basophils (x10e9/L): ${val("baso")}\n`;
      report += "COMMENT\n";
      report += `RBC: ${getGroupValues("rbc_morph", "rbc_other")}\n`;
      report += `WBC: ${getGroupValues("wbc_morph", "wbc_other")}\n`;
      report += `PLT: ${getGroupValues("plt_morph", "plt_other")}\n`;
      report += "\n" + "-".repeat(50) + "\n";

      // Materials
      report += "MATERIALS RECEIVED\n";
      report += "    --Bone marrow trephine biopsy\n";
      report += "    --Bone marrow aspirate\n";
      report += `Bone marrow aspirate:    ${val("asp_quality")}\n`;
      report += `Aspirate fragments:      ${val("asp_fragments")}\n`;
      report += `Aspirate Cellularity:    ${val("asp_cellularity")}\n`;
      report += `Clot Section:            Marrow particles present with trilineage hematopoiesis, overall similar to aspirate findings.\n`;

      // Description
      report += "DESCRIPTION\n";
      report += `Erythropoiesis:         ${val("ery_status")}\n`;
      report += `    Morphology: ${val("ery_morph")}\n`;
      report += `    Ring sideroblasts: ${val("rs_status")}\n`;
      report += `Granulopoiesis:         ${val("gran_status")}\n`;
      report += `    Morphology: ${val("gran_morph")}\n`;
      report += `Megakaryopoiesis:       ${val("mega_status")}\n`;
      report += `    Morphology: ${val("mega_morph")}\n`;
      report += `Mast Cells:             ${val("mast_cells")}\n`;
      report += `Lymphocytes:            Not increased\n`;
      report += `Plasma cells:           Not increased\n`;
      report += `Iron stores:            ${val("iron_stores")}\n`;
      report += `Blasts:                 ${val("asp_blasts_desc")}\n`;
      report += "\n" + "-".repeat(50) + "\n";

      // Differential
      report += "- Differential count -\n";
      report += `Number of Cells Counted: ${val("diff_total")}\n`;
      report += `Blasts: ${val("d_blasts")}%\n`;
      report += `Promyelocytes: ${val("d_pro")}% \n`;
      report += `Myelocytes: ${val("d_myelo")}% \n`;
      report += `Metamyelocytes: ${val("d_meta")}% \n`;
      report += `Neutrophils: ${val("d_neut")}% \n`;
      report += `Erythroblasts: ${val("d_ery")}% \n`;
      report += `Lymphocytes: ${val("d_lym")}% \n`;
      report += `Plasma cells: ${val("d_plasma")}% \n\n`;
      report += `M:E ratio: ${val("me_ratio")}\n`;
      report += "\n" + "-".repeat(50) + "\n";

      report += "- Flow cytometry -\n";
      report += val("flow_summary");

      document.getElementById("reportOutput").textContent = report;
    }

    function copyReport() {
      const text = document.getElementById("reportOutput").textContent;
      navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
    }

    function resetForm() {
      if(confirm("Clear all entries?")) {
        document.getElementById("reportForm").reset();
        document.getElementById("reportOutput").textContent = "The generated report will appear here...";
      }
    }
  </script>
</body>
</html>
